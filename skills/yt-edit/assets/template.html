<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>/*TITLE*/</title>
<style>
/*THEME*/
:root{--u:calc(/*HEIGHT*/ / 1080)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background)}
#stage{position:relative;width:100%;height:100%;overflow:hidden;color:var(--text);font-family:Arial,Helvetica,sans-serif}
#video-wrap{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;overflow:hidden;z-index:4;background:var(--background)}
#footage{display:block;width:100%;height:100%;object-fit:contain}
.card-host{position:absolute;pointer-events:none}.root{position:absolute;inset:0}.a{opacity:0;visibility:hidden}
.z-screen{z-index:3}.z-col,.z-side,.z-sidel,.z-tag{z-index:5}.z-full{z-index:8}
.glass{background:var(--surface);border:1px solid var(--border)}
.tc{color:var(--accent)}.itf,.it{font-family:Georgia,serif;font-style:italic}
.k{font-size:calc(16px * var(--u));line-height:1.3;letter-spacing:.1em;color:var(--muted);font-weight:600}
.side{position:absolute;left:0;right:0;bottom:0;border-radius:calc(18px * var(--u));padding:calc(25px * var(--u));display:flex;flex-direction:column;gap:calc(15px * var(--u))}
.st{font-size:calc(32px * var(--u));line-height:1.12;font-weight:800;color:var(--text)}
.row{display:flex;gap:calc(12px * var(--u));align-items:baseline;font-size:calc(23px * var(--u));font-weight:600;line-height:1.3}
.ix{font-size:calc(19px * var(--u));color:var(--accent);min-width:calc(26px * var(--u))}.rt{display:flex;flex-direction:column}
.rs{font-size:calc(18px * var(--u));font-weight:400;color:var(--muted);line-height:1.35;margin-top:calc(5px * var(--u))}
.foot{margin-top:calc(10px * var(--u));font-size:calc(22px * var(--u));line-height:1.3}
.chips{display:flex;gap:calc(8px * var(--u));flex-wrap:wrap}.chip{display:inline-block;font-size:calc(18px * var(--u));font-weight:600;padding:calc(8px * var(--u)) calc(13px * var(--u));border-radius:30px;background:var(--accent);color:var(--highlight-text);white-space:nowrap}
.chip.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.chip.warn{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.tag{border-radius:calc(16px * var(--u));padding:calc(22px * var(--u));display:flex;gap:calc(9px * var(--u));flex-wrap:wrap;align-content:flex-start}
.tag .k{width:100%}.tt{font-size:calc(30px * var(--u));line-height:1.2;font-weight:700;margin-right:calc(8px * var(--u))}
.z-screen .root{background:var(--background);overflow:hidden}.z-screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.z-col .root{position:relative}.note{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;gap:calc(7px * var(--u));border:0;background:transparent;padding:0}
.note .k{font-size:calc(15px * var(--u))}.note .nt{font-size:calc(30px * var(--u));font-weight:800;line-height:1.15}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;padding:40px;background:var(--surface)}
.ph-k{font-size:22px;letter-spacing:.1em;color:var(--accent)}.ph-t{font-size:44px;text-align:center}.ph-s{font-size:24px;color:var(--muted)}
.z-full .root{background:var(--background);color:var(--text)}.fwrap{position:absolute;left:6%;top:28%;right:6%}
.fk{font-size:calc(21px * var(--u));letter-spacing:.12em;color:var(--accent);margin-bottom:calc(25px * var(--u))}
.fh{font-size:calc(138px * var(--u));font-weight:800;line-height:.98;letter-spacing:-.035em}.fh2{font-size:calc(106px * var(--u))}.fh3{font-size:calc(120px * var(--u))}
.ch{display:none}.cur{display:inline-block;background:var(--accent);width:calc(6px * var(--u));height:.75em;margin-left:calc(12px * var(--u))}
.fs{font:italic calc(42px * var(--u))/1.25 Georgia,serif;margin-top:calc(30px * var(--u));color:var(--muted)}
.track{position:absolute;left:6%;right:6%;bottom:9%;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.seg .bar{height:5px;background:var(--border)}
.seg .bar i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%}.seg.done .bar i{transform:scaleX(1)}
.seg .sl{font-size:20px;margin-top:14px}.seg .sd{font-size:16px;color:var(--muted);margin-top:8px}
.sidel{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(14px * var(--u))}
.tool{position:relative;border-radius:calc(16px * var(--u));padding:calc(18px * var(--u));display:flex;align-items:center;gap:calc(16px * var(--u))}
.tlogo{width:calc(60px * var(--u));height:calc(60px * var(--u));display:flex;align-items:center;justify-content:center;flex:none}.tlogo img{max-width:100%;max-height:100%}
.tname{display:flex;flex-direction:column;font-size:calc(28px * var(--u));font-weight:800}.tname span{font-size:calc(18px * var(--u));line-height:1.25;font-weight:400;color:var(--muted);margin-top:5px}
.pdf{padding:22px;border-radius:12px;background:var(--text);color:var(--background)}.ph1{font-size:25px;font-weight:800}.pr{display:flex;gap:16px;border-top:1px solid var(--border);padding:12px 0}.pfoot{font-size:14px}
#caps{position:absolute;left:0;right:0;bottom:calc(36px * var(--u));height:calc(116px * var(--u));z-index:10;pointer-events:none}
.caption-page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.caption-text{display:inline-block;max-width:/*CAPWIDTH*/px;padding:calc(12px * var(--u)) calc(18px * var(--u));border-radius:calc(12px * var(--u));background:var(--background);font-size:calc(38px * var(--u));font-weight:700;line-height:1.25;color:var(--text);text-align:center}
.w{display:inline-block;padding:0 3px;border-radius:5px;background-color:transparent;color:var(--text)}
</style></head><body>
<div id="stage" data-composition-id="/*ID*/" data-start="0" data-duration="/*DUR*/" data-fps="/*FPS*/" data-width="/*WIDTH*/" data-height="/*HEIGHT*/">
<div id="video-wrap"><video id="footage" class="clip" src="/*FOOTAGE*/" playsinline data-start="0" data-duration="/*DUR*/" data-track-index="1" data-has-audio="true"></video></div>
<!--HOSTS-->
<div id="caps"><!--CAPTIONS--></div>
<script src="vendor/gsap.min.js"></script><script>
(function(){
const FPS=/*FPS*/,DUR=/*DUR*/,L=/*LAYOUT*/,LEAD=/*WORD_LEAD*/;
const tl=gsap.timeline({paused:true}),q=t=>Math.round(t*FPS)/FPS;
const ANIMS=/*ANIMS*/,PAGES=/*PAGES*/,WORDS=/*WORDS*/,RUNS=/*STATES*/;
const css=getComputedStyle(document.documentElement);
const accent=css.getPropertyValue('--accent').trim(),text=css.getPropertyValue('--text').trim(),ink=css.getPropertyValue('--highlight-text').trim();
ANIMS.forEach(([sel,kind,time,options])=>{
 const els=document.querySelectorAll(sel);if(!els.length)return;
 const t=q(time),o=options||{},base={immediateRender:false,ease:'power2.out'};
 if(['in','left','pop'].includes(kind)){
  tl.set(els,{autoAlpha:1},t);tl.fromTo(els,{y:6*L.scale},{...base,y:0,duration:.22},t);
 }else if(kind==='fade')tl.fromTo(els,{autoAlpha:0},{...base,autoAlpha:1,duration:.16},t);
 else if(kind==='out')tl.fromTo(els,{autoAlpha:1},{...base,autoAlpha:0,duration:o.d||.24,ease:'power1.in'},t);
 else if(kind==='hi')tl.fromTo(els,{opacity:.32},{...base,opacity:1,duration:.1},t);
 else if(kind==='strike'||kind==='fill')tl.fromTo(els,{scaleX:0},{...base,scaleX:1,duration:o.d||.5},t);
 else if(kind==='scroll')tl.fromTo(els,{y:0},{...base,y:o.dy,duration:o.d||.8},t);
 else if(kind==='type'){
  const chars=els[0].querySelectorAll('.ch');chars.forEach((el,i)=>tl.set(el,{display:'inline-block'},q(t+i*Math.min(o.step,.035))));
  const cursor=els[0].querySelector('.cur');if(cursor)tl.to(cursor,{opacity:0,duration:.12},Math.min(o.until,t+chars.length*Math.min(o.step,.035)+.3));
 }
});
tl.set('#video-wrap',{x:0,y:0,scale:1,borderRadius:0},0);
RUNS.forEach(([a,b])=>{
 const duration=Math.min(.5,(b-a)/3);
 tl.to('#video-wrap',{x:L.pip_x,y:L.pip_y,scale:L.pip_scale,borderRadius:32,duration,ease:'power2.inOut'},q(a));
 tl.to('#video-wrap',{x:0,y:0,scale:1,borderRadius:0,duration,ease:'power2.inOut'},q(b-duration));
});
PAGES.forEach(([a,b,first,last])=>{
 for(let i=first;i<=last;i++){
  const el=document.getElementById('w'+i);if(!el)continue;
  const start=Math.max(a,WORDS[i][0]-LEAD),end=Math.min(b,i<last?WORDS[i+1][0]-LEAD:WORDS[i][1]+.08);
  tl.set(el,{backgroundColor:accent,color:ink},q(start));
  tl.set(el,{backgroundColor:'transparent',color:text},q(Math.max(start+.01,end)));
 }
});
tl.set({}, {}, DUR);
window.__timelines=window.__timelines||{};window.__timelines['/*ID*/']=tl;
})();
</script></div></body></html>
